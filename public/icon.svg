  <g transform="translate(140, 160) scale(1.15)">
    <path d="M60.8 77.2c16.3 32 42.4 58.1 74.4 74.4l24.9-24.9c3.1-3.1 7.6-4.1 11.5-2.8 12.5 4.1 26 6.3 39.9 6.3 6.6 0 12 5.4 12 12v42c0 6.6-5.4 12-12 12C94.4 196.2 15.8 117.6 15.8 20c0-6.6 5.4-12 12-12h42c6.6 0 12 5.4 12 12 0 13.9 2.2 27.4 6.3 39.9 1.3 3.9.3 8.4-2.8 11.5L60.8 77.2z" fill="#ffffff" filter="url(#shadow)"/>
  </g>

  <!-- Video Camera badge -->
  <g transform="translate(300, 300)">
    <circle cx="64" cy="64" r="64" fill="url(#accent)" filter="url(#shadow)"/>
    <path d="M44 48h32c6.6 0 12 5.4 12 12v16c0 6.6-5.4 12-12 12H44c-6.6 0-12-5.4-12-12V60c0-6.6 5.4-12 12-12zm48 14l20-12v36l-20-12V62z" fill="#ffffff"/>
